<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img"><title>B02 阴角、阳角、门套端头的踢脚线收口示意</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#253630}.dim{fill:#68756d;font-size:13px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="45" y="42" text-anchor="start" font-size="24" class="">B02 / 好看的收边，结束处也要完整</text><text x="45" y="75" text-anchor="start" font-size="15" class="dim">平面收口原理 · 不按比例，采用选定型材的配套节点</text><text x="45" y="127" text-anchor="start" font-size="20" class="">阴角 / 内转角</text><rect x="65" y="165" width="260" height="35" rx="0" fill="#d6ddd2" stroke="#8d9a90" stroke-width="1.3"/><rect x="65" y="200" width="35" height="165" rx="0" fill="#d6ddd2" stroke="#8d9a90" stroke-width="1.3"/><rect x="101" y="201" width="224" height="15" rx="0" fill="#f8faf2" stroke="#8d9a90" stroke-width="1.3"/><rect x="101" y="216" width="15" height="148" rx="0" fill="#f8faf2" stroke="#8d9a90" stroke-width="1.3"/><path d="M101 201 L116 216" fill="none" stroke="#73806e" stroke-width="1.5" stroke-dasharray=""/><text x="45" y="409" text-anchor="start" font-size="16" class="dim">贴合墙角，不留积灰洞。</text><text x="45" y="441" text-anchor="start" font-size="16" class="dim">拼缝或配套内角件，颜色一致。</text><text x="415" y="127" text-anchor="start" font-size="20" class="">阳角 / 外转角</text><rect x="435" y="165" width="180" height="150" rx="0" fill="#d6ddd2" stroke="#8d9a90" stroke-width="1.3"/><rect x="435" y="316" width="194" height="15" rx="0" fill="#f8faf2" stroke="#8d9a90" stroke-width="1.3"/><rect x="616" y="165" width="15" height="150" rx="0" fill="#f8faf2" stroke="#8d9a90" stroke-width="1.3"/><path d="M615 315 L630 330" fill="none" stroke="#73806e" stroke-width="1.5" stroke-dasharray=""/><text x="415" y="409" text-anchor="start" font-size="16" class="dim">斜切去毛刺或使用配套外角件。</text><text x="415" y="441" text-anchor="start" font-size="16" class="dim">避免尖锐金属边外露。</text><text x="785" y="127" text-anchor="start" font-size="20" class="">门套 / 结束处</text><rect x="790" y="205" width="240" height="35" rx="0" fill="#d6ddd2" stroke="#8d9a90" stroke-width="1.3"/><rect x="790" y="241" width="178" height="15" rx="0" fill="#f8faf2" stroke="#8d9a90" stroke-width="1.3"/><rect x="969" y="238" width="8" height="21" rx="0" fill="#e1e7db" stroke="#8d9a90" stroke-width="1.3"/><rect x="981" y="188" width="49" height="82" rx="0" fill="#f3f6ec" stroke="#8d9a90" stroke-width="1.3"/><text x="929" y="305" text-anchor="middle" font-size="14" class="">配套端帽</text><path d="M937 287 L973 260" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="785" y="409" text-anchor="start" font-size="16" class="dim">端头闭合，衔接门套。</text><text x="785" y="441" text-anchor="start" font-size="16" class="dim">与门扇开启及地面收口一起核对。</text><text x="45" y="513" text-anchor="start" font-size="15" class="dim">先做一段样板：直线＋转角＋门套端头。白天与夜间看色差，用湿拖布轻擦后再确认整屋施工。</text></svg>