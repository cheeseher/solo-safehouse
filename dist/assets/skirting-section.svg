<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 810" role="img"><title>B01 同墙色明装踢脚线：木地板墙脚剖面概念</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#253630}.dim{fill:#68756d;font-size:13px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="45" y="42" text-anchor="start" font-size="24" class="">B01 / 不开槽，也能把墙脚保护好</text><text x="45" y="76" text-anchor="start" font-size="15" class="dim">剖面原理图 · 示例 H60 / 外凸 P15 / 伸缩缝 G10，单位 mm</text><rect x="90" y="125" width="210" height="570" rx="0" fill="#d7ddd5" stroke="#8f9b8d" stroke-width="1.3"/><rect x="290" y="125" width="10" height="495" rx="0" fill="#f7f8f1" stroke="#adb5a8" stroke-width="1.3"/><rect x="90" y="700" width="505" height="45" rx="0" fill="#c4cabe" stroke="#8f9b8d" stroke-width="1.3"/><rect x="360" y="620" width="235" height="75" rx="0" fill="#d8c9aa" stroke="#a9987a" stroke-width="1.3"/><text x="188" y="175" text-anchor="middle" font-size="16" class="">墙体 / 找平基层</text><text x="466" y="665" text-anchor="middle" font-size="18" class="">木地板</text><text x="466" y="729" text-anchor="middle" font-size="15" class="">垫层 / 基层</text><rect x="301" y="290" width="8" height="280" rx="0" fill="#b2c5ad" stroke="#71866c" stroke-width="1.3"/><path d="M309 300 L381 300" fill="none" stroke="#a7b6a0" stroke-width="3" stroke-dasharray=""/><path d="M309 560 L381 560" fill="none" stroke="#a7b6a0" stroke-width="3" stroke-dasharray=""/><rect x="381" y="262" width="9" height="349" rx="0" fill="#fafbf5" stroke="#8d9c87" stroke-width="1.3"/><rect x="309" y="260" width="81" height="10" rx="0" fill="#fafbf5" stroke="#8d9c87" stroke-width="1.3"/><path d="M90 620 L360 620" fill="none" stroke="#8e9a88" stroke-width="1" stroke-dasharray="4 4"/><path d="M420 260 L420 620" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><path d="M411 260 L429 260" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><path d="M411 620 L429 620" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="442" y="454" text-anchor="start" font-size="15" class="">H = 60</text><path d="M300 220 L390 220" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><path d="M300 214 L300 226" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><path d="M390 214 L390 226" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="345" y="207" text-anchor="middle" font-size="15" class="">P = 15</text><path d="M300 680 L360 680" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="330" y="674" text-anchor="middle" font-size="13" class="">G10</text><text x="650" y="160" text-anchor="start" font-size="21" class="">01  同色的成品表面</text><text x="650" y="196" text-anchor="start" font-size="16" class="dim">低矮、平直、哑光；不做装饰凹槽。</text><text x="650" y="273" text-anchor="start" font-size="21" class="">02  型材固定在墙上</text><text x="650" y="309" text-anchor="start" font-size="16" class="dim">胶或配套卡扣按厂家系统安装。</text><text x="650" y="386" text-anchor="start" font-size="21" class="">03  留足遮盖量</text><text x="650" y="422" text-anchor="start" font-size="16" class="dim">示例 15 − 10 = 5mm，不是通用尺寸。</text><text x="650" y="499" text-anchor="start" font-size="21" class="">04  地板仍能伸缩</text><text x="650" y="535" text-anchor="start" font-size="16" class="dim">不把型材压死、钉死在浮铺地板上。</text><text x="650" y="612" text-anchor="start" font-size="21" class="">05  拖地接触的是收边</text><text x="650" y="648" text-anchor="start" font-size="16" class="dim">有防潮要求时按地板厂家做弹性封边。</text><text x="45" y="782" text-anchor="start" font-size="14" class="dim">截面仅表达构造关系，不是订货截面。P 必须覆盖实际 G、安装偏差与遮盖余量；高度并非防水等级。</text></svg>