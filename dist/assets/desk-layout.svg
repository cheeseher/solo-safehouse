屏 / 含底座占位</text><path d="M504.6 234 L818 234" fill="none" stroke="#45634e" stroke-width="5" stroke-dasharray=""/><text x="661.3" y="340.2" text-anchor="middle" font-size="15" class="">屏幕正面 ↓</text><rect x="896.2" y="206.7" width="118.8" height="118.8" rx="4" fill="#e3e7e4" stroke="#81917e" stroke-width="1.3"/><text x="955.6" y="263.1" text-anchor="middle" font-size="14" class="">Mac mini</text><text x="955.6" y="286.1" text-anchor="middle" font-size="13" class="">预留位</text><rect x="448" y="387.6" width="432" height="216" rx="4" fill="#dedfd4" stroke="#81917e" stroke-width="1.3"/><text x="664" y="588.6" text-anchor="middle" font-size="16" class="">桌垫 800 × 400</text><rect x="547.9" y="455.1" width="226.8" height="70.2" rx="4" fill="#fafbf7" stroke="#81917e" stroke-width="1.3"/><text x="661.3" y="494.2" text-anchor="middle" font-size="16" class="">苹果键盘</text><rect x="799" y="457.8" width="43.2" height="70.2" rx="4" fill="#fafbf7" stroke="#81917e" stroke-width="1.3"/><text x="820.6" y="549" text-anchor="middle" font-size="14" class="">鼠标</text><path d="M110.5 204 L110.5 185.1" fill="none" stroke="#6a8470" stroke-width="2" stroke-dasharray="4 3"/><path d="M315.7 204 L315.7 185.1" fill="none" stroke="#6a8470" stroke-width="2" stroke-dasharray="4 3"/><path d="M661.3 204 L661.3 185.1" fill="none" stroke="#6a8470" stroke-width="2" stroke-dasharray="4 3"/><path d="M944.8 204 L944.8 185.1" fill="none" stroke="#6a8470" stroke-width="2" stroke-dasharray="4 3"/><path d="M661.3 357.9 L661.3 382.2" fill="none" stroke="#2f6a4d" stroke-width="2" stroke-dasharray="5 4"/><path d="M661.3 641 L661.3 671" fill="none" stroke="#2f6a4d" stroke-width="2" stroke-dasharray=""/><text x="661.3" y="698" text-anchor="middle" font-size="18" class="">座位中心 / 对齐主屏与键盘</text><text x="55" y="757" text-anchor="start" font-size="16" class="dim">显示器先以两块 27 英寸级别占位；具体外廓、底座或支架需按实物复核。</text><text x="55" y="790" text-anchor="start" font-size="16" class="dim">MacBook 默认合盖停放；需要打开使用时，移出立式位，不在夹持状态强行开盖。</text><text x="55" y="823" text-anchor="start" font-size="16" class="dim">各设备矩形为布置预留，不是产品标称尺寸。桌垫下方不压电源或发热设备。</text></svg>