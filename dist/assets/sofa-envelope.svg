<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img"><title>S01 俯视：电动沙发最大活动区与通道；单位 mm</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#253630}.dim{fill:#68756d;font-size:13px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="45" y="42" text-anchor="start" font-size="24" class="">S01 / 展开以后，仍然走得过去</text><text x="45" y="76" text-anchor="start" font-size="15" class="dim">与全屋平面同向 · 图左电视，图右沙发 · 概念预留，单位 mm</text><rect x="80" y="145" width="702" height="533" rx="3" fill="#f2f3eb" stroke="#8f9b88" stroke-width="1.3"/><rect x="80" y="246.4" width="52" height="312" rx="3" fill="#d2c7b6" stroke="#8f9b88" stroke-width="1.3"/><rect x="171" y="171" width="130" height="468" rx="3" fill="#d5e7d3" stroke="#8f9b88" stroke-width="1.3"/><rect x="411.5" y="210.0" width="279.5" height="364.0" fill="#ddc29e" fill-opacity=".25" stroke="#a16b30" stroke-width="2" stroke-dasharray="7 5"/><rect x="509" y="223" width="136.5" height="338" rx="3" fill="#bbc9b6" stroke="#8f9b88" stroke-width="1.3"/><rect x="610.4" y="241.2" width="26" height="301.6" rx="3" fill="#91a58e" stroke="#8f9b88" stroke-width="1.3"/><text x="249" y="418" text-anchor="middle" font-size="17" class="">主要通路</text><text x="249" y="450.5" text-anchor="middle" font-size="17" class="">1000</text><text x="577.25" y="366" text-anchor="middle" font-size="17" class="">收起占位</text><text x="577.25" y="398.5" text-anchor="middle" font-size="15" class="">2600 × 1050</text><text x="551.25" y="561" text-anchor="middle" font-size="15" class="">← 脚托伸展</text><path d="M411.5 600 L691 600" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="551.25" y="632.5" text-anchor="middle" font-size="15" class="">活动深度预留 2150</text><text x="825" y="185" text-anchor="start" font-size="19" class="">脚托 + 靠背</text><text x="825" y="218" text-anchor="start" font-size="14" class="dim">最大范围按型号复核。</text><text x="825" y="297" text-anchor="start" font-size="19" class="">后仰与墙面</text><text x="825" y="330" text-anchor="start" font-size="14" class="dim">不能按收起状态贴墙摆。</text><text x="825" y="409" text-anchor="start" font-size="19" class="">机器人禁入</text><text x="825" y="442" text-anchor="start" font-size="14" class="dim">整块活动区排除清扫。</text><text x="825" y="521" text-anchor="start" font-size="19" class="">餐桌停放</text><text x="825" y="554" text-anchor="start" font-size="14" class="dim">回到厨房 C06 右段。</text><text x="45" y="727" text-anchor="start" font-size="15" class="dim">虚线范围 2800 × 2150 为选型预留，不是某款沙发的实测尺寸；单座动作也按完整活动区避让。</text><text x="45" y="765" text-anchor="start" font-size="15" class="dim">净躺长目标 1850、单座净宽目标 1050；试躺后再定型号，机构下方不承诺机器人可进入。</text></svg>