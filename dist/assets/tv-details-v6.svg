<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 810" role="img"><title>C02 移动电视柜架与 T02 边几概念尺寸，非制造图</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#253630}.dim{fill:#68756d;font-size:13px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="45" y="45" text-anchor="start" font-size="25" class="">移动的是整套设备，不只是一块屏幕。</text><text x="45" y="78" text-anchor="start" font-size="15" class="dim">C02 / 正立面与平面包络 · T02 / 移动边几 · 单位 mm</text><rect x="65" y="130" width="375" height="213" rx="3" fill="#2c3539" stroke="#172124" stroke-width="1.3"/><rect x="243" y="343" width="18" height="51" rx="0" fill="#a4aaa9" stroke="#8d9a90" stroke-width="1.3"/><rect x="87.5" y="394" width="330" height="108" rx="3" fill="#e4e3de" stroke="#7f8785" stroke-width="1.3"/><path d="M252 394 L252 502" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="170" y="443" text-anchor="middle" font-size="14" class="">播放器 / 遥控器</text><text x="335" y="443" text-anchor="middle" font-size="14" class="">支架 / 收线</text><rect x="104" y="507" width="20" height="23" rx="6" fill="#6e7977" stroke="#596563" stroke-width="1.3"/><rect x="385" y="507" width="20" height="23" rx="6" fill="#6e7977" stroke="#596563" stroke-width="1.3"/><path d="M87 558 L418 558" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="252" y="585" text-anchor="middle" font-size="16" class="">柜宽 1100 / 本体高 360</text><text x="252" y="617" text-anchor="middle" font-size="14" class="dim">轮组占高目标 100 · 屏幕中心约 1050</text><rect x="590" y="160" width="375" height="180" rx="3" fill="#eef3f7" stroke="#547491" stroke-width="1.3"/><rect x="612.5" y="167.5" width="330" height="165" rx="0" fill="#d4dbdf" stroke="#547491" stroke-width="1.3"/><text x="777" y="214" text-anchor="middle" font-size="18" class="">整机校核包络</text><text x="777" y="245" text-anchor="middle" font-size="20" class="">1250 × 600</text><text x="777" y="279" text-anchor="middle" font-size="15" class="">柜体 1100 × 550</text><text x="777" y="370" text-anchor="middle" font-size="14" class="dim">屏幕外伸、底盘与脚轮一起计入</text><rect x="615" y="465" width="135" height="12" rx="6" fill="#d7dad8" stroke="#758781" stroke-width="1.3"/><rect x="650" y="477" width="8" height="135" rx="0" fill="#c7cfcb" stroke="#8d9a90" stroke-width="1.3"/><rect x="710" y="477" width="8" height="135" rx="0" fill="#c7cfcb" stroke="#8d9a90" stroke-width="1.3"/><rect x="615" y="612" width="135" height="9" rx="0" fill="#c7cfcb" stroke="#8d9a90" stroke-width="1.3"/><rect x="625" y="621" width="15" height="16" rx="5" fill="#758781" stroke="#758781" stroke-width="1.3"/><rect x="730" y="621" width="15" height="16" rx="5" fill="#758781" stroke="#758781" stroke-width="1.3"/><text x="790" y="492" text-anchor="start" font-size="18" class="">T02 / 圆角硬质台面</text><text x="790" y="527" text-anchor="start" font-size="16" class="">450 × 350 · 高 550</text><text x="790" y="562" text-anchor="start" font-size="15" class="dim">四轮驻停 · 不承坐人</text><text x="790" y="595" text-anchor="start" font-size="15" class="dim">转移电视前先让开</text><text x="45" y="710" text-anchor="start" font-size="16" class="">过门方向：屏幕长边沿行进方向时，需检查的是整机深度与转弯扫过的范围。</text><text x="45" y="745" text-anchor="start" font-size="15" class="dim">支架连接到底盘，柜壳只负责收纳与外观。承载、稳定性与 VESA 匹配须由成品厂家确认。</text><text x="45" y="779" text-anchor="start" font-size="15" class="dim">尺寸为选型目标；55 英寸仅是屏幕级别，具体外廓、重量与轮组会改变移动条件。</text></svg>