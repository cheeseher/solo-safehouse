<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img"><title>H01 干区挂放概念：吹风机与电线一体归位</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#253630}.dim{fill:#68756d;font-size:13px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="55" y="45" text-anchor="start" font-size="23" class="">H01  /  打开、取用、整体归位</text><text x="55" y="76" text-anchor="start" font-size="15" class="dim">干区侧柜内固定挂架 · 示意不按比例</text><rect x="85" y="140" width="355" height="390" rx="4" fill="#e2dece" stroke="#a4aa9a" stroke-width="1.3"/><rect x="105" y="158" width="315" height="350" rx="3" fill="#f4f3e9" stroke="#a4aa9a" stroke-width="1.3"/><rect x="172" y="213" width="138" height="63" rx="20" fill="#a9b7ae" stroke="#647a6d" stroke-width="1.3"/><rect x="214" y="261" width="43" height="123" rx="12" fill="#a9b7ae" stroke="#647a6d" stroke-width="1.3"/><path d="M185 310 L280 310" fill="none" stroke="#617c6b" stroke-width="10" stroke-dasharray=""/><path d="M236 384 C210 435 365 460 349 390 C335 334 287 398 342 434" fill="none" stroke="#586b60" stroke-width="5" stroke-linecap="round"/><rect x="337" y="426" width="23" height="30" rx="3" fill="#586b60" stroke="#586b60" stroke-width="1.3"/><text x="490" y="185" text-anchor="start" font-size="22" class="">固定的是支架</text><text x="490" y="219" text-anchor="start" font-size="16" class="dim">机身可取下，常用风嘴就近放。</text><text x="490" y="288" text-anchor="start" font-size="22" class="">机身与线缆共用一个空间</text><text x="490" y="322" text-anchor="start" font-size="16" class="dim">电线松绕归位，不穿过独立隔板。</text><text x="490" y="391" text-anchor="start" font-size="22" class="">收纳状态断电</text><text x="490" y="425" text-anchor="start" font-size="16" class="dim">取出使用；冷却、干燥后再关门。</text><text x="490" y="494" text-anchor="start" font-size="22" class="">不硬塞进 150mm 镜柜</text><text x="490" y="528" text-anchor="start" font-size="16" class="dim">位置与净尺寸，按选定机型深化。</text><text x="55" y="620" text-anchor="start" font-size="15" class="dim">避开水槽与淋浴溅水范围；插座位置、保护措施与设备要求由专业人员复核。</text></svg>