<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" role="img"><title>S01 固定布艺沙发与贵妃榻俯视概念图；单位 mm</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#253630}.dim{fill:#68756d;font-size:13px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="45" y="42" text-anchor="start" font-size="24" class="">S01 / 坐面像床，靠垫托住身体</text><text x="45" y="77" text-anchor="start" font-size="15" class="dim">与全屋平面同向 · 左侧电视，右侧沙发；下方为露台 · 单位 mm</text><rect x="70" y="135" width="756" height="574" rx="5" fill="#f4f4ed" stroke="#879985" stroke-width="1.3"/><rect x="70" y="244.2" width="56" height="336" rx="5" fill="#d9d0be" stroke="#879985" stroke-width="1.3"/><rect x="168" y="163" width="140" height="504" rx="5" fill="#e0ecd9" stroke="#879985" stroke-width="1.3"/><rect x="553" y="191" width="161" height="420" rx="5" fill="#c4cbbd" stroke="#879985" stroke-width="1.3"/><rect x="420" y="457" width="294" height="154" rx="5" fill="#c4cbbd" stroke="#879985" stroke-width="1.3"/><rect x="679" y="212" width="28" height="364" rx="5" fill="#a3b49c" stroke="#879985" stroke-width="1.3"/><rect x="420" y="464" width="259" height="140" rx="5" fill="#f8faf2" stroke="#879985" stroke-width="1.3"/><text x="602" y="352" text-anchor="middle" font-size="18" class="">深座沙发</text><text x="553" y="520" text-anchor="middle" font-size="18" class="">固定贵妃榻</text><text x="553" y="553.6" text-anchor="middle" font-size="14" class="">净躺区目标</text><text x="553" y="581.6" text-anchor="middle" font-size="15" class="">1850 × 1000</text><text x="238" y="415" text-anchor="middle" font-size="17" class="">主要通路</text><text x="238" y="450" text-anchor="middle" font-size="17" class="">1000</text><path d="M420 657.2 L714 657.2" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="567" y="689.4" text-anchor="middle" font-size="15" class="">贵妃总深 2100</text><path d="M756 191 L756 611" fill="none" stroke="#93a097" stroke-width="1" stroke-dasharray=""/><text x="763" y="380" text-anchor="start" font-size="14" class="">总宽</text><text x="763" y="412.2" text-anchor="start" font-size="15" class="">3000</text><text x="875" y="180" text-anchor="start" font-size="18" class="">低而舒展</text><text x="875" y="214" text-anchor="start" font-size="13" class="dim">坐面高目标 430mm。</text><text x="875" y="295" text-anchor="start" font-size="18" class="">普通段总深</text><text x="875" y="329" text-anchor="start" font-size="13" class="dim">1150mm，腰靠可移动。</text><text x="875" y="410" text-anchor="start" font-size="18" class="">靠窗长榻</text><text x="875" y="444" text-anchor="start" font-size="13" class="dim">总深不等于净躺长。</text><text x="875" y="525" text-anchor="start" font-size="18" class="">封闭落地底座</text><text x="875" y="559" text-anchor="start" font-size="13" class="dim">沿边清扫，不钻底部。</text><text x="45" y="763" text-anchor="start" font-size="15" class="dim">L 形固定占位：主段 3000 × 1150，贵妃段 1100 × 2100；连接处重叠计入主段，不重复加宽。</text><text x="45" y="802" text-anchor="start" font-size="15" class="dim">净躺尺寸以靠垫就位后的实际可用区域为准。效果图表达比例和材质，不作为成品加工图。</text></svg>